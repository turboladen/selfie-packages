name: kitty
homepage: https://github.com/kovidgoyal/kitty
description: >-
  If you live in the terminal, kitty is made for you! Cross-platform, fast,
  feature-rich, GPU based.

environments:
  macos-home:
    install: brew install --cask kitty
    check: brew list --cask kitty
    dependencies:
      - homebrew
  macos-work:
    install: brew install --cask kitty
    check: brew list --cask kitty
    dependencies:
      - homebrew

name: mcfly
homepage: https://github.com/cantino/mcfly
description: Fly through your shell history. Great Scott!

environments:
  macos-work:
    install: |
      set -e
      brew install mcfly
      echo "mcfly init fish | source" >> ~/.config/fish/conf.d/mcfly.fish
    check: |
      set -e
      command -v mcfly
      ls ~/.config/fish/conf.d/mcfly.fish &> /dev/null
    dependencies:
      - homebrew
  macos-home:
    install: |
      set -e
      brew install mcfly
      echo "mcfly init fish | source" >> ~/.config/fish/conf.d/mcfly.fish
    check: |
      set -e
      command -v mcfly
      ls ~/.config/fish/conf.d/mcfly.fish &> /dev/null
    dependencies:
      - homebrew
  arch-home:
    install: |
      set -e
      sudo pacman -S --noconfirm --needed mcfly
      echo "mcfly init fish | source" >> ~/.config/fish/conf.d/mcfly.fish
    check: |
      set -e
      command -v mcfly
      ls ~/.config/fish/conf.d/mcfly.fish &> /dev/null
    dependencies: []

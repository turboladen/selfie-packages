name: typos
homepage: https://github.com/crate-ci/typos
description: Source code spell checker
environments:
  macos-home:
    install: brew install typos-cli
    check: command -v typos
    dependencies:
    - homebrew
  macos-work:
    install: brew install typos-cli
    check: command -v typos
    dependencies:
    - homebrew

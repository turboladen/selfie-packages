name: asm-lsp
homepage: https://github.com/bergercookie/asm-lsp
description: Language server for NASM/GAS/GO Assembly

environments:
  macos-home:
    install: cargo binstall asm-lsp
    check: command -v asm-lsp
    dependencies:
      - cargo-binstall
  arch-home:
    install: cargo binstall asm-lsp
    check: command -v asm-lsp
    dependencies:
      - cargo-binstall

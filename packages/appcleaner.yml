name: appcleaner
homepage: https://freemacsoft.net/appcleaner/
description: >-
  AppCleaner is a small application which allows you to thoroughly uninstall
  unwanted apps.

environments:
  macos-work:
    install: brew install --cask appcleaner
    check: brew list --cask appcleaner
    dependencies:
      - homebrew
  macos-home:
    install: brew install --cask appcleaner
    check: brew list --cask appcleaner
    dependencies:
      - homebrew

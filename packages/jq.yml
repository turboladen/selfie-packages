name: jq
homepage: https://github.com/jqlang/jq
description: Command-line JSON processor

environments:
  macos-work:
    install: brew install jq
    check: command -v jq
    dependencies:
      - homebrew
  macos-home:
    install: brew install jq
    check: command -v jq
    dependencies:
      - homebrew
  arch-home:
    install: sudo pacman -S --noconfirm --needed jq
    check: command -v jq
    dependencies: []

name: lua
homepage: https://www.lua.org/
description: >-
  Lightweight, embeddable scripting language — used heavily for Neovim plugin
  configuration.

environments:
  macos-work:
    install: brew install lua
    check: command -v lua
    dependencies:
      - homebrew
  macos-home:
    install: brew install lua
    check: command -v lua
    dependencies:
      - homebrew

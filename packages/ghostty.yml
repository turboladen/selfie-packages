name: ghostty
homepage: https://ghostty.org/
description: >-
  Ghostty is a fast, feature-rich, and cross-platform terminal emulator that uses
  platform-native UI and GPU acceleration.

environments:
  macos-work:
    install: brew install --cask ghostty
    check: ls /Applications/Ghostty.app/ &> /dev/null
    dependencies:
      - homebrew
  macos-home:
    install: brew install --cask ghostty
    check: ls /Applications/Ghostty.app/ &> /dev/null
    dependencies:
      - homebrew

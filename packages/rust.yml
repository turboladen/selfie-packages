name: rust
homepage: https://www.rust-lang.org
description: |
  A language empowering everyone to build reliable and efficient software
environments:
  macos-home:
    install: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    check: command -v rustup && command -v cargo
    dependencies:
    - curl
  macos-work:
    install: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    check: command -v rustup && command -v cargo
    dependencies:
    - curl
